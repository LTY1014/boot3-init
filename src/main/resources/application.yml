server:
  port: 8100
  servlet:
    context-path: /

spring:
  application:
    # TODO 修改名称
    name: boot3-init
    version: 1.0.0
  session:
    # 生效时间为一天
    timeout: 86400
  # TODO 修改数据库
  datasource:
    url: jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  #mapper路径
  mapper-locations: classpath:mapper/*.xml
  #mapper配置路径
  # config-location: classpath:static/mybatis/mybatis-config.xml
  global-config:
    # 关闭MP3.0+自带的banner
    banner: false
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  configuration:
    #下划线转驼峰
    map-underscore-to-camel-case: false
    #打印SQL日志
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ''

logging:
  # 输出级别
  level:
    root: info
    com.lty.mapper: DEBUG  # 替换为实际的mapper包路径
  file:
    # 指定路径
    path: logs
  logback:
    rollingpolicy:
      # 最大保存天数
      max-history: 7
      # 每个文件最大大小
      max-file-size: 5MB

knife4j:
  enable: true